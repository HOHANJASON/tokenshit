<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexToken Local - 管理後台</title>
<style>
:root{--bg:#0b0f14;--side:#101720;--panel:#151e28;--panel2:#1c2733;--line:#2c3947;--text:#edf3f8;--muted:#92a2b2;--gold:#f2c94c;--green:#45d29a;--red:#ff8585;--blue:#79aaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC",system-ui,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(400px,100%);border:1px solid var(--line);background:var(--panel);padding:26px;border-radius:8px}.brand{font-weight:800;color:var(--gold);font-size:19px}.brand span{color:var(--text)}h1{font-size:24px;margin:20px 0 5px}p{color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input,select{width:100%;background:#090d12;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px}.primary,.secondary,.danger{border-radius:6px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:var(--gold);border:1px solid var(--gold);color:#111}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{background:transparent;border:1px solid rgba(255,133,133,.45);color:var(--red)}.login-box .primary{width:100%;margin-top:18px}.error{color:var(--red);font-size:13px;min-height:20px}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;min-height:0}.sidebar nav{display:grid;gap:4px;margin-top:28px;min-height:0;overflow:auto;padding-bottom:12px;scrollbar-width:thin}.sidebar button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}.sidebar button.on,.sidebar button:hover{background:var(--panel2);color:var(--text)}.side-footer{display:grid;gap:8px;margin-top:auto;padding-top:12px;flex:0 0 auto}.side-footer a{color:var(--blue);text-decoration:none;font-size:13px;padding:7px 11px}.main{min-width:0}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px}.topbar h1{font-size:20px;margin:0}.content{padding:22px 24px 50px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:15px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.table-wrap{border:1px solid var(--line);border-radius:7px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}th{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase}td{background:var(--panel)}tr:last-child td{border-bottom:0}.status{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px}.ok{color:var(--green);background:rgba(69,210,154,.1)}.off{color:var(--red);background:rgba(255,133,133,.1)}.actions{display:flex;gap:6px}.actions button{padding:6px 8px;font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel)}dialog{width:min(560px,calc(100% - 28px));background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0}dialog::backdrop{background:rgba(0,0,0,.7)}.dialog-head{padding:15px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-head h2{font-size:17px;margin:0}.dialog-body{padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.check{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:13px}.check input{width:auto}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 13px;border-radius:6px;transform:translateY(150%);transition:.2s}.toast.on{transform:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:block}.sidebar nav{grid-template-columns:repeat(5,1fr);overflow:auto;margin-top:15px}.side-footer{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:540px){.content,.topbar{padding-left:14px;padding-right:14px}.stats{grid-template-columns:1fr}.sidebar nav{grid-template-columns:repeat(5,110px)}}
</style>
<style>
:root{--bg:#f5f7fb;--side:#fff;--panel:#fff;--panel2:#f8fafc;--line:#e5e9f0;--text:#18202b;--muted:#718096;--gold:#4f46e5;--green:#13a36f;--red:#dc5960;--blue:#4f46e5}body{background:var(--bg);font-size:14px}.shell{grid-template-columns:248px 1fr}.sidebar{background:#fff;padding:22px 16px;box-shadow:1px 0 0 var(--line);border:0}.brand{color:#4f46e5;font-size:20px;letter-spacing:-.4px}.brand span{color:#111827}.sidebar nav{gap:5px;margin-top:30px}.sidebar nav::before{content:"管理控制台";color:#9aa5b5;font-size:11px;font-weight:700;letter-spacing:.08em;padding:0 12px 8px}.sidebar button{color:#64748b;font-weight:600;padding:11px 13px}.sidebar button.on,.sidebar button:hover{background:#eef2ff;color:#4338ca}.sidebar button.on{box-shadow:inset 3px 0 #4f46e5}.side-footer{border-top:1px solid var(--line);padding-top:12px}.main{background:#f5f7fb}.topbar{height:68px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-color:var(--line)}.topbar h1{font-size:19px}.content{max-width:1500px;margin:auto;padding:26px 28px 60px}.stats{gap:14px}.stat{border:1px solid var(--line);border-radius:11px;padding:18px;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.035)}.stat span{font-weight:600}.stat b{display:block;margin-top:8px;color:#111827}.section-head{margin:22px 0 13px}.section-head h2{font-size:17px}.table-wrap{border-color:var(--line);border-radius:11px;box-shadow:0 2px 8px rgba(15,23,42,.03)}th{background:#f8fafc;color:#64748b;padding:12px 14px}td{background:#fff;color:#334155;padding:13px 14px}.status{font-weight:700}.ok{background:#eafaf3;color:#16865f}.off{background:#fff0f0;color:#cc4b53}input,select{background:#fff;color:#1f2937;border-color:#d9dee7}.primary{background:#4f46e5;border-color:#4f46e5;color:#fff;box-shadow:0 2px 5px rgba(79,70,229,.2)}.secondary{background:#fff;border-color:#d9dee7;color:#475569}.danger{color:#dc5960;background:#fff}.empty{background:#fff}dialog{background:#fff;color:#1f2937;border:0;border-radius:12px;box-shadow:0 24px 60px rgba(15,23,42,.22)}.dialog-head{background:#f8fafc;border-color:var(--line)}.toast{background:#172033;color:white;border:0;box-shadow:0 10px 30px rgba(15,23,42,.25)}code{color:#4338ca}.login-box{background:white;color:#1f2937;border-color:var(--line);box-shadow:0 18px 50px rgba(15,23,42,.1);border-radius:14px}@media(max-width:900px){.shell{grid-template-columns:1fr}.content{padding:18px}.sidebar nav::before{display:none}}
</style>
<style>
#overviewPage::before{content:"NexToken AI 管理控制台\A管理供應商、模型路由、價格、客戶額度與 API 用量。";white-space:pre-line;display:block;padding:20px 22px;margin-bottom:16px;border-radius:12px;color:#fff;font-size:14px;line-height:1.8;background:linear-gradient(110deg,#4338ca,#6366f1 60%,#818cf8);box-shadow:0 10px 28px rgba(79,70,229,.18)}#nav button::before{display:inline-block;width:24px;color:#818cf8}#nav button[data-page="overview"]::before{content:"◫"}#nav button[data-page="providers"]::before{content:"◉"}#nav button[data-page="models"]::before{content:"◇"}#nav button[data-page="routes"]::before{content:"⑂"}#nav button[data-page="customers"]::before{content:"♙"}#nav button[data-page="logs"]::before{content:"≡"}
</style>
<style>
:root{--bg:#080a0d;--side:#0d1015;--panel:#12161c;--panel2:#181d25;--line:#2a303a;--text:#f3f5f7;--muted:#98a2b0;--gold:#f4c84b;--green:#39c98a;--red:#ff7279;--blue:#f4c84b}body,.main{background:var(--bg);color:var(--text)}.sidebar{background:var(--side);box-shadow:1px 0 0 var(--line)}.brand{color:var(--gold)}.brand span{color:#fff}.sidebar nav::before{content:"NexToken Console";color:#6f7885}.sidebar button{color:#98a2b0}.sidebar button.on,.sidebar button:hover{background:rgba(244,200,75,.1);color:var(--gold)}.sidebar button.on{box-shadow:inset 3px 0 var(--gold)}.topbar{background:rgba(13,16,21,.94);border-color:var(--line)}.content{background:var(--bg)}.stat,.table-wrap,.empty{background:var(--panel);border-color:var(--line);box-shadow:none}.stat b{color:#fff}th{background:var(--panel2);color:#aab3bf}td{background:var(--panel);color:#e3e7eb}.primary{background:var(--gold);border-color:var(--gold);color:#111;box-shadow:0 2px 8px rgba(244,200,75,.18)}.secondary,.danger{background:var(--panel2);border-color:var(--line);color:var(--text)}input,select{background:#0b0e12;color:#fff;border-color:var(--line)}dialog{background:var(--panel);color:#fff;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.6)}.dialog-head{background:var(--panel2);border-color:var(--line)}code{color:var(--gold)}#overviewPage::before{background:linear-gradient(110deg,#17130a,#28200b 55%,#4a3908);border:1px solid rgba(244,200,75,.28);color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.25)}.nav-group{display:block;color:#68717e;font-size:11px;font-weight:800;letter-spacing:.1em;padding:18px 12px 6px}.sidebar button[disabled]{opacity:.45;cursor:not-allowed}.sidebar button[disabled]:hover{background:transparent;color:#98a2b0}.login-box{background:var(--panel);color:#fff;border-color:var(--line)}
</style>
</head>
<body>
<div id="loginView" class="login-page"><form class="login-box" id="loginForm"><div class="brand">Nex<span>Token</span> Local</div><h1>管理後台</h1><p>管理供應商、模型、客戶與 API 用量。</p><label>管理員帳號</label><input id="loginUser" value="admin" autocomplete="username"><label>管理員密碼</label><input id="loginPass" type="password" autocomplete="current-password"><button class="primary">登入</button><div class="error" id="loginError"></div></form></div>
<div id="appView" class="shell hidden"><aside class="sidebar"><div class="brand">Nex<span>Token</span> Local</div><nav id="nav"><button data-page="overview" class="on">總覽</button><button data-page="providers">供應商</button><button data-page="models">模型價格</button><button data-page="routes">通道路由</button><button data-page="customers">客戶</button><button data-page="logs">用量日誌</button></nav><div class="side-footer"><a href="/" target="_blank">開啟客戶網站</a><a href="/customer" target="_blank">開啟客戶控制台</a><button class="danger" id="logout">登出</button></div></aside><main class="main"><header class="topbar"><h1 id="pageTitle">總覽</h1><button class="secondary" id="refresh">重新整理</button></header><div class="content"><section id="overviewPage"><div class="stats" id="stats"></div><div class="section-head"><h2>系統狀態</h2></div><div class="table-wrap"><table><tbody><tr><th>服務</th><th>網址</th><th>狀態</th></tr><tr><td>客戶網站</td><td><code id="shopUrl"></code></td><td><span class="status ok">運行中</span></td></tr><tr><td>OpenAI 相容 API</td><td><code id="apiUrl"></code></td><td><span class="status ok">運行中</span></td></tr></tbody></table></div></section><section id="providersPage" class="hidden"><div class="section-head"><h2>供應商通道</h2><button class="primary" onclick="openProvider()">新增通道</button></div><div id="providersTable"></div></section><section id="modelsPage" class="hidden"><div class="section-head"><h2>模型與售價</h2><button class="primary" onclick="openModel()">新增模型</button></div><div id="modelsTable"></div></section><section id="routesPage" class="hidden"><div class="section-head"><h2>模型多通道路由</h2><button class="primary" onclick="openRoute()">新增路由</button></div><label>選擇模型</label><select id="routeModelFilter" onchange="loadRoutes()"></select><div id="routesTable" style="margin-top:12px"></div></section><section id="customersPage" class="hidden"><div class="section-head"><h2>客戶與餘額</h2></div><div id="customersTable"></div></section><section id="logsPage" class="hidden"><div class="section-head"><h2>最近 200 筆 API 請求</h2></div><div id="logsTable"></div></section></div></main></div>
<dialog id="providerDialog"><form id="providerForm"><div class="dialog-head"><h2 id="providerTitle">新增供應商</h2><button type="button" class="secondary" onclick="providerDialog.close()">關閉</button></div><div class="dialog-body"><input type="hidden" id="providerId"><label>名稱</label><input id="providerName" required placeholder="OpenAI 官方"><label>API Base URL</label><input id="providerUrl" required placeholder="https://api.openai.com/v1"><label>上游 API Key</label><input id="providerKey" required type="password" placeholder="sk-..."><div class="grid2"><div><label>優先順序</label><input id="providerPriority" type="number" value="10" min="0"></div><label class="check"><input id="providerActive" type="checkbox" checked>啟用通道</label></div><div class="dialog-actions"><button type="button" class="secondary" onclick="providerDialog.close()">取消</button><button class="primary">儲存</button></div></div></form></dialog>
<dialog id="modelDialog"><form id="modelForm"><div class="dialog-head"><h2 id="modelTitle">新增模型</h2><button type="button" class="secondary" onclick="modelDialog.close()">關閉</button></div><div class="dialog-body"><input type="hidden" id="modelId"><div class="grid2"><div><label>客戶模型名稱</label><input id="modelPublic" required placeholder="gpt-5.5"></div><div><label>上游模型名稱</label><input id="modelUpstream" required placeholder="gpt-5.5"></div></div><div class="grid2"><div><label>API 類型</label><select id="modelEndpoint"><option value="chat">Chat / Token 計費</option><option value="image">Image / 按張計費</option></select></div><div><label>供應商</label><select id="modelProvider" required></select></div></div><div class="grid2"><div><label>上游輸入成本 / 1M</label><input id="inputCost" type="number" min="0" step="0.000001" value="0"></div><div><label>上游輸出成本 / 1M</label><input id="outputCost" type="number" min="0" step="0.000001" value="0"></div><div><label>客戶輸入售價 / 1M</label><input id="inputPrice" type="number" min="0" step="0.000001" required></div><div><label>客戶輸出售價 / 1M</label><input id="outputPrice" type="number" min="0" step="0.000001" required></div><div><label>上游每張成本</label><input id="unitCost" type="number" min="0" step="0.000001" value="0"></div><div><label>客戶每張售價</label><input id="unitPrice" type="number" min="0" step="0.000001" value="0"></div></div><label class="check"><input id="modelActive" type="checkbox" checked>在客戶網站顯示並允許呼叫</label><div class="dialog-actions"><button type="button" class="secondary" onclick="modelDialog.close()">取消</button><button class="primary">儲存</button></div></div></form></dialog>
<dialog id="routeDialog"><form id="routeForm"><div class="dialog-head"><h2 id="routeTitle">新增路由</h2><button type="button" class="secondary" onclick="routeDialog.close()">關閉</button></div><div class="dialog-body"><input type="hidden" id="routeId"><label>模型</label><select id="routeModel" required></select><label>供應商</label><select id="routeProvider" required></select><label>上游模型名稱</label><input id="routeUpstream" required><div class="grid2"><div><label>輸入成本 / 1M</label><input id="routeInputCost" type="number" min="0" step="0.000001" value="0"></div><div><label>輸出成本 / 1M</label><input id="routeOutputCost" type="number" min="0" step="0.000001" value="0"></div><div><label>每張成本</label><input id="routeUnitCost" type="number" min="0" step="0.000001" value="0"></div><div><label>優先級</label><input id="routePriority" type="number" min="0" value="10"></div><div><label>權重</label><input id="routeWeight" type="number" min="1" value="100"></div><label class="check"><input id="routeActive" type="checkbox" checked>啟用路由</label></div><div class="dialog-actions"><button type="button" class="secondary" onclick="routeDialog.close()">取消</button><button class="primary">儲存</button></div></div></form></dialog>
<div class="toast" id="toast"></div>
<script>
let token=localStorage.getItem('nex_admin_token')||'',providers=[],models=[];const $=id=>document.getElementById(id);const money=v=>'$'+Number(v||0).toFixed(4);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(path,opt);if(r.status===401){logoutNow();throw new Error('登入已失效')}const data=await r.json();if(!r.ok)throw new Error(data.detail||'操作失敗');return data}function showToast(msg){toast.textContent=msg;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2500)}function logoutNow(){localStorage.removeItem('nex_admin_token');token='';appView.classList.add('hidden');loginView.classList.remove('hidden')}
loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})});const d=await r.json();if(!r.ok)throw new Error(d.detail);token=d.token;localStorage.setItem('nex_admin_token',token);start()}catch(err){loginError.textContent=err.message}};logout.onclick=logoutNow;refresh.onclick=()=>loadPage(document.querySelector('#nav .on').dataset.page);nav.onclick=e=>{if(!e.target.dataset.page)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');loadPage(e.target.dataset.page)};
function start(){loginView.classList.add('hidden');appView.classList.remove('hidden');shopUrl.textContent=location.origin;apiUrl.textContent=location.origin+'/v1';loadPage('overview')}function page(name){['overview','providers','models','routes','customers','logs'].forEach(x=>$(x+'Page').classList.toggle('hidden',x!==name));pageTitle.textContent={overview:'總覽',providers:'供應商通道',models:'模型與價格',routes:'多通道路由',customers:'客戶管理',logs:'用量日誌'}[name]}
async function loadPage(name){page(name);try{if(name==='overview')await loadOverview();if(name==='providers')await loadProviders();if(name==='models')await loadModels();if(name==='routes')await prepareRoutes();if(name==='customers')await loadCustomers();if(name==='logs')await loadLogs()}catch(e){showToast(e.message)}}
async function loadOverview(){const d=await api('/api/admin/dashboard');stats.innerHTML=[['客戶',d.customers],['啟用供應商',d.providers],['啟用模型',d.models],['API 請求',d.requests],['累計收入',money(d.revenue)]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function table(headers,rows){if(!rows.length)return'<div class="empty">目前沒有資料</div>';return`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
async function loadProviders(){providers=await api('/api/admin/providers');providersTable.innerHTML=table(['名稱','Base URL','優先','狀態','操作'],providers.map(p=>`<tr><td><b>${p.name}</b></td><td><code>${p.base_url}</code></td><td>${p.priority}</td><td><span class="status ${p.active?'ok':'off'}">${p.active?'啟用':'停用'}</span></td><td class="actions"><button class="secondary" onclick="testProvider(${p.id})">測試</button><button class="secondary" onclick="openProvider(${p.id})">編輯</button></td></tr>`))}
function openProvider(id){const p=providers.find(x=>x.id===id);providerTitle.textContent=p?'編輯供應商':'新增供應商';providerId.value=p?.id||'';providerName.value=p?.name||'';providerUrl.value=p?.base_url||'https://api.openai.com/v1';providerKey.value=p?'********':'';providerPriority.value=p?.priority??10;providerActive.checked=p?.active??true;providerDialog.showModal()}
providerForm.onsubmit=async e=>{e.preventDefault();const id=providerId.value,body={name:providerName.value,base_url:providerUrl.value,api_key:providerKey.value,priority:Number(providerPriority.value),active:providerActive.checked};try{await api('/api/admin/providers'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(body)});providerDialog.close();showToast('供應商已儲存');loadProviders()}catch(err){showToast(err.message)}};async function testProvider(id){showToast('正在測試通道');const d=await api(`/api/admin/providers/${id}/test`,{method:'POST'});showToast(d.ok?`測試成功 ${d.latency_ms}ms`:`測試失敗 HTTP ${d.status}`)}
async function loadModels(){models=await api('/api/admin/models');if(!providers.length)providers=await api('/api/admin/providers');modelsTable.innerHTML=table(['模型','類型','供應商／路由','成本','售價','狀態','操作'],models.map(m=>`<tr><td><b>${m.public_name}</b><br><small>${m.upstream_model}</small></td><td>${m.endpoint_type==='image'?'Image':'Chat'}</td><td>${m.provider_name}<br><small>${m.route_count} 條路由</small></td><td>${m.endpoint_type==='image'?money(m.unit_cost):money(m.input_cost)+' / '+money(m.output_cost)}</td><td>${m.endpoint_type==='image'?money(m.unit_price):money(m.input_price)+' / '+money(m.output_price)}</td><td><span class="status ${m.active?'ok':'off'}">${m.active?'上架':'下架'}</span></td><td><button class="secondary" onclick="openModel(${m.id})">編輯</button></td></tr>`))}
async function openModel(id){if(!providers.length)providers=await api('/api/admin/providers');modelProvider.innerHTML=providers.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');const m=models.find(x=>x.id===id);modelTitle.textContent=m?'編輯模型':'新增模型';modelId.value=m?.id||'';modelPublic.value=m?.public_name||'';modelUpstream.value=m?.upstream_model||'';modelEndpoint.value=m?.endpoint_type||'chat';modelProvider.value=m?.provider_id||providers[0]?.id||'';inputCost.value=m?.input_cost??0;outputCost.value=m?.output_cost??0;inputPrice.value=m?.input_price??0;outputPrice.value=m?.output_price??0;unitCost.value=m?.unit_cost??0;unitPrice.value=m?.unit_price??0;modelActive.checked=m?.active??true;modelDialog.showModal()}
modelForm.onsubmit=async e=>{e.preventDefault();const id=modelId.value,body={public_name:modelPublic.value,upstream_model:modelUpstream.value,provider_id:Number(modelProvider.value),input_cost:Number(inputCost.value),output_cost:Number(outputCost.value),input_price:Number(inputPrice.value),output_price:Number(outputPrice.value),endpoint_type:modelEndpoint.value,unit_cost:Number(unitCost.value),unit_price:Number(unitPrice.value),active:modelActive.checked};try{await api('/api/admin/models'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(body)});modelDialog.close();showToast('模型已儲存');loadModels()}catch(err){showToast(err.message)}};
async function prepareRoutes(){if(!models.length)models=await api('/api/admin/models');if(!providers.length)providers=await api('/api/admin/providers');routeModelFilter.innerHTML=models.map(m=>`<option value="${m.id}">${m.public_name}</option>`).join('');await loadRoutes()}
async function loadRoutes(){const modelId=Number(routeModelFilter.value);if(!modelId){routesTable.innerHTML='<div class="empty">請先建立模型</div>';return}const rows=await api(`/api/admin/models/${modelId}/routes`);routesTable.dataset.rows=JSON.stringify(rows);routesTable.innerHTML=table(['供應商','上游模型','優先／權重','失敗','狀態','操作'],rows.map(r=>`<tr><td>${r.provider_name}</td><td><code>${r.upstream_model}</code></td><td>${r.priority} / ${r.weight}</td><td>${r.failure_count}${r.disabled_until?'<br><small>冷卻至 '+new Date(r.disabled_until).toLocaleTimeString()+'</small>':''}</td><td><span class="status ${r.active&&!r.disabled_until?'ok':'off'}">${r.active?'啟用':'停用'}</span></td><td><button class="secondary" onclick="openRoute(${r.id})">編輯</button></td></tr>`))}
function openRoute(id){const rows=JSON.parse(routesTable.dataset.rows||'[]'),r=rows.find(x=>x.id===id);routeTitle.textContent=r?'編輯路由':'新增路由';routeId.value=r?.id||'';routeModel.innerHTML=models.map(m=>`<option value="${m.id}">${m.public_name}</option>`).join('');routeModel.value=routeModelFilter.value||models[0]?.id||'';routeModel.disabled=!!r;routeProvider.innerHTML=providers.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');routeProvider.value=r?.provider_id||providers[0]?.id||'';routeUpstream.value=r?.upstream_model||'';routeInputCost.value=r?.input_cost??0;routeOutputCost.value=r?.output_cost??0;routeUnitCost.value=r?.unit_cost??0;routePriority.value=r?.priority??10;routeWeight.value=r?.weight??100;routeActive.checked=r?.active??true;routeDialog.showModal()}
routeForm.onsubmit=async e=>{e.preventDefault();const id=routeId.value,modelId=Number(routeModel.value),body={provider_id:Number(routeProvider.value),upstream_model:routeUpstream.value,input_cost:Number(routeInputCost.value),output_cost:Number(routeOutputCost.value),unit_cost:Number(routeUnitCost.value),priority:Number(routePriority.value),weight:Number(routeWeight.value),active:routeActive.checked};try{await api(id?`/api/admin/routes/${id}`:`/api/admin/models/${modelId}/routes`,{method:id?'PUT':'POST',body:JSON.stringify(body)});routeDialog.close();routeModel.disabled=false;routeModelFilter.value=String(modelId);showToast('路由已儲存');loadRoutes()}catch(err){showToast(err.message)}};
async function loadCustomers(){const rows=await api('/api/admin/customers');customersTable.innerHTML=table(['ID','Email','Gmail','餘額','狀態','建立時間','操作'],rows.map(c=>`<tr><td>${c.id}</td><td>${c.email}</td><td>${c.gmail?`<span class="status ok">${c.gmail}</span><br><small>${c.gmail_bound_at?new Date(c.gmail_bound_at).toLocaleString():''}</small>`:'<span class="status off">未綁定</span>'}</td><td><b>${money(c.balance)}</b></td><td><span class="status ${c.active?'ok':'off'}">${c.active?'正常':'停用'}</span></td><td>${new Date(c.created_at).toLocaleString()}</td><td class="actions"><button class="primary" onclick="topup(${c.id},'${c.email}')">調整餘額</button><button class="secondary" onclick="manageKeys(${c.id},'${c.email}')">Key 限流</button></td></tr>`))}async function topup(id,email){const value=prompt(`調整 ${email} 的餘額。正數加值，負數扣除：`,'10');if(value===null)return;const amount=Number(value);if(!Number.isFinite(amount)||amount===0)return showToast('金額不正確');try{const d=await api('/api/admin/topup',{method:'POST',body:JSON.stringify({customer_id:id,amount,note:'Admin manual adjustment'})});showToast(`新餘額 ${money(d.balance)}`);loadCustomers()}catch(e){showToast(e.message)}}
async function manageKeys(customerId,email){const keys=await api(`/api/admin/customers/${customerId}/keys`);if(!keys.length)return showToast('此客戶尚未建立 API Key');const summary=keys.map((k,i)=>`${i+1}. ${k.name} (${k.prefix}…) RPM=${k.rpm_limit} TPM=${k.tpm_limit}`).join('\n');const pick=prompt(`${email} 的 API Key：\n${summary}\n\n輸入要調整的編號：`,'1');if(pick===null)return;const key=keys[Number(pick)-1];if(!key)return showToast('編號不正確');const rpm=prompt('每分鐘請求數 RPM（0 表示不限）：',String(key.rpm_limit));if(rpm===null)return;const tpm=prompt('每分鐘 Token 數 TPM（0 表示不限）：',String(key.tpm_limit));if(tpm===null)return;await api(`/api/admin/keys/${key.id}/limits`,{method:'PATCH',body:JSON.stringify({rpm_limit:Number(rpm),tpm_limit:Number(tpm)})});showToast('API Key 限流已更新')}
async function loadLogs(){const rows=await api('/api/admin/logs');logsTable.innerHTML=table(['時間','客戶','模型／端點','用量','成本','收入','HTTP','延遲'],rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>#${x.customer_id}</td><td>${x.model}<br><small>${x.endpoint}</small></td><td>${x.units?x.units+' 張':x.tokens+' tokens'}</td><td>${money(x.cost)}</td><td>${money(x.charge)}</td><td><span class="status ${x.status<400?'ok':'off'}">${x.status}</span></td><td>${x.latency_ms}ms</td></tr>`))}
if(token)start();
</script>
