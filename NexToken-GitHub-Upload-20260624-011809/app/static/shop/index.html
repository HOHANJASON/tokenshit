["5. 退款規則","尚未使用的付費額度，可於付款完成後 7 日內申請退款。已使用額度、贈送額度、支付手續費及加密貨幣網路費用不予退還；法律另有強制規定者除外。退款原則上退回原付款方式，處理時間約 3 至 10 個工作日。"],
["6. 異常、停權與拒付","發現異常流量、疑似金鑰外洩、詐欺、拒付、濫用或規避限制時，平台得暫停金鑰或帳號並進行人工審核。確認錯誤扣款時將返還相應額度；涉及退款或拒付時，相關額度得先行凍結。"],

["8. 可用性與責任","除另有書面約定外，本服務不保證不中斷、永久提供特定模型或符合所有用途。上游限流、維護、政策變更或不可抗力可能影響服務。於法律允許範圍內，平台對間接損失不負責；消費者依法享有的強制權利不受影響。"],
["9. 條款變更與聯絡","重大條款變更將以網站公告或合理方式通知。繼續使用服務視為接受更新後條款；不同意時應停止使用並依退款規則處理未使用額度。客服信箱：nextoken.support@gmail.com。適用法律及管轄依強制法令辦理。"]]},
